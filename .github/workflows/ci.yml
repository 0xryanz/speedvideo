name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: speedvideo
          POSTGRES_PASSWORD: speedvideo
          POSTGRES_DB: speedvideo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speedvideo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Verify migrations against Postgres
        env:
          DATABASE_URL: postgres://speedvideo:speedvideo@localhost:5432/speedvideo?sslmode=disable
        run: go run ./cmd/migrate

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: collector/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.speedvideo.example

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: speedvideo-api:ci
      - name: Build collector image
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          push: false
          tags: speedvideo-collector:ci
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: false
          tags: speedvideo-admin:ci
