name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.4"
  API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL || 'https://api.speedvideo.example' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with the debug key."
          fi

      - run: flutter pub get
      - name: Build APK
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release \
            --build-name="${VERSION#v}" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "speedvideo-${GITHUB_REF_NAME}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/speedvideo-*-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build unsigned app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${VERSION#v}" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "speedvideo-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: app/speedvideo-*-ios-unsigned.ipa
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build macOS app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build macos --release \
            --build-name="${VERSION#v}" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package ZIP and DMG
        run: |
          APP=build/macos/Build/Products/Release/speedvideo.app
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "speedvideo-${GITHUB_REF_NAME}-macos.zip"
          hdiutil create -volname "SpeedVideo" -srcfolder "$APP" \
            -ov -format UDZO "speedvideo-${GITHUB_REF_NAME}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            app/speedvideo-*-macos.zip
            app/speedvideo-*-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows app
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $version = $env:VERSION -replace '^v', ''
          flutter build windows --release `
            --build-name="$version" `
            --build-number="$env:BUILD_NUMBER" `
            --dart-define=API_BASE_URL="$env:API_BASE_URL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "speedvideo-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/speedvideo-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, ios, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Android | `speedvideo-*-android.apk` | 直接安装；未配置签名 Secrets 时为 debug 签名 |
            | iOS | `speedvideo-*-ios-unsigned.ipa` | 未签名，需要 AltStore / Sideloadly / Xcode 重签后安装 |
            | macOS | `speedvideo-*-macos.dmg` / `.zip` | 未公证；首次打开如被拦截，执行 `xattr -cr /Applications/speedvideo.app` |
            | Windows | `speedvideo-*-windows-x64.zip` | 解压后运行 `speedvideo.exe` |

            ## 构建信息

            - 版本：`${{ github.ref_name }}`
            - 提交：`${{ github.sha }}`
            - API 地址由仓库变量/Secrets `API_BASE_URL` 注入
            - 工作流：`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            安装包未做商店签名与公证。正式分发前请配置自己的 Android 签名证书、
            Apple Developer 证书与公证流程。
