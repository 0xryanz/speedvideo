name: speedvideo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedvideo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speedvideo-local-only}
      POSTGRES_DB: speedvideo
    ports:
      - "5433:5432"
    volumes:
      - speedvideo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedvideo -d speedvideo"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://speedvideo:${POSTGRES_PASSWORD:-speedvideo-local-only}@db:5432/speedvideo?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please-32}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-dev-only-media-signing-key-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      AUTO_MIGRATE: "true"
      TRUST_PROXY_HEADERS: "false"
      # Development only: allows a local fixture to be used as a content
      # source over http. config.Load rejects this outside development.
      SOURCE_ALLOW_INSECURE: "${SOURCE_ALLOW_INSECURE:-false}"
      # Guards the collection control plane (/v1/admin/*). Held by the admin
      # console's reverse proxy, never shipped to a browser.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"

  collector:
    build:
      context: ./collector
    restart: unless-stopped
    # Give an in-flight job time to release its lease on SIGTERM.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://speedvideo:${POSTGRES_PASSWORD:-speedvideo-local-only}@db:5432/speedvideo?sslmode=disable
      COLLECTOR_SYNC_INTERVAL: ${COLLECTOR_SYNC_INTERVAL:-6h}
      COLLECTOR_CONCURRENCY: "${COLLECTOR_CONCURRENCY:-2}"
      COLLECTOR_FETCH_CONCURRENCY: "${COLLECTOR_FETCH_CONCURRENCY:-8}"
      COLLECTOR_LIST_CONCURRENCY: "${COLLECTOR_LIST_CONCURRENCY:-4}"
      COLLECTOR_JOB_LEASE: "${COLLECTOR_JOB_LEASE:-60s}"
      # Development only: allows a local fixture over http.
      COLLECTOR_ALLOW_INSECURE: "${COLLECTOR_ALLOW_INSECURE:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_UPSTREAM: http://api:8080
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token}
    ports:
      - "${ADMIN_PORT:-8096}:8080"

volumes:
  speedvideo-pg:
